name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        default: ""
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, win-x64, osx-x64, osx-arm64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Publish for ${{ matrix.rid }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          ver="${tag#v}"
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$ver" \
            -o artifacts/${{ matrix.rid }} \
            TagSelecta.App
      - name: Zip output
        run: |
          cd artifacts/${{ matrix.rid }}
          zip -r ../tagselecta-${{ matrix.rid }}.zip .
          cd ../..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tagselecta-${{ matrix.rid }}
          path: artifacts/tagselecta-${{ matrix.rid }}.zip
  release-body:
    name: Generate release body
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.release-body.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Generate release body
        uses: orhun/git-cliff-action@v4
        id: release-body
        with:
          config: cliff.toml
          args: --verbose --current --strip header
  release:
    name: Create GitHub Release
    needs: release-body
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Determine tag name
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: dist/**/*.zip
          body: ${{ needs.release-body.outputs.release_body }}
