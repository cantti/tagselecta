name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

  build-and-release:
    if: >-
      ${{
        always() &&
        (github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true')
      }}
    needs: release-please
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, win-x64, osx-x64, osx-arm64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Publish for ${{ matrix.rid }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="${{ needs.release-please.outputs.tag_name }}"
          fi
          ver="${tag#v}"
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$ver" \
            -o artifacts/${{ matrix.rid }} \
            TagSelecta.App
      - name: Zip output
        run: |
          cd artifacts/${{ matrix.rid }}
          zip -r ../tagselecta-${{ matrix.rid }}.zip .
          cd ../..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tagselecta-${{ matrix.rid }}
          path: artifacts/tagselecta-${{ matrix.rid }}.zip

  release:
    if: >-
      ${{
        always() &&
        (github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true')
      }}
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
          draft: false
          prerelease: false
          files: dist/**/*.zip
